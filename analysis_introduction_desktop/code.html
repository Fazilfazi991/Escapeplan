<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Analysis Introduction - EscapePlan</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

                        "surface-container-high": "#eae7e7",
                        "on-background": "#1c1b1b",
                        "surface-variant": "#e5e2e1",
                        "on-surface": "#1c1b1b",
                        "inverse-surface": "#313030",
                        "tertiary-container": "#c64b4d",
                        "on-primary-fixed-variant": "#2f2ebe",
                        "on-secondary": "#ffffff",
                        "surface-container-highest": "#e5e2e1",
                        "on-primary-container": "#fffbff",
                        "tertiary-fixed": "#ffdad8",
                        "inverse-primary": "#c0c1ff",
                        "on-error-container": "#93000a",
                        "on-tertiary": "#ffffff",
                        "on-secondary-container": "#4b6d00",
                        "on-secondary-fixed": "#131f00",
                        "outline-variant": "#c7c4d7",

                        "inverse-on-surface": "#f3f0ef",
                        "tertiary": "#a53337",
                        "on-error": "#ffffff",
                        "on-secondary-fixed-variant": "#354e00",
                        "error": "#ba1a1a",
                        "surface": "#fcf9f8",
                        "on-tertiary-fixed": "#410006",
                        "on-tertiary-fixed-variant": "#881d24",
                        "on-primary": "#ffffff",
                        "secondary": "#476800",
                        "tertiary-fixed-dim": "#ffb3b0",
                        "primary-fixed": "#e1e0ff",
                        "on-surface-variant": "#464554",
                        "surface-container-low": "#f6f3f2",
                        "secondary-fixed": "#bff365"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "4px",
                        "md": "16px",
                        "gutter": "20px",
                        "sm": "8px",
                        "margin-desktop": "64px",
                        "lg": "24px",
                        "margin-mobile": "20px",
                        "xs": "4px",
                        "xl": "40px"
                    },
                    "fontFamily": {
                        "display-lg-mobile": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "label-md": ["Plus Jakarta Sans"],
                        "display-lg": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"],

                    "fontSize": {

                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }]

                }

        }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Custom Animations */
        @keyframes drawCircle {
            0% { stroke-dashoffset: 283; transform: rotate(-90deg) scale(0.95); opacity: 0; }
            50% { opacity: 1; }
            100% { stroke-dashoffset: 70; transform: rotate(270deg) scale(1); opacity: 1; }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 15px 40px rgba(70,72,212,0.08), 0 0 0 0 rgba(70,72,212,0.1); }
            50% { box-shadow: 0 15px 40px rgba(70,72,212,0.12), 0 0 0 20px rgba(70,72,212,0); }
        }

        .animate-draw-circle {
            stroke-dasharray: 283;
            animation: drawCircle 3s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
            transform-origin: center;
        }

        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        .animate-pulse-glow {
            animation: pulseGlow 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        /* Staggered fade in for list */
        .stage-item {
            opacity: 0;
            transform: translateY(10px);
            animation: fadeInUp 0.5s ease-out forwards;
        }
        .stage-item:nth-child(1) { animation-delay: 0.5s; }
        .stage-item:nth-child(2) { animation-delay: 1.5s; }
        .stage-item:nth-child(3) { animation-delay: 2.5s; }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
<link rel="stylesheet" href="/prototype.css" />
</head>
<body class="bg-surface-bright text-on-surface antialiased min-h-screen flex flex-col font-body-md">
<!-- Automatic Suppression of Navigation/Footer as this is a linear/transactional intro screen -->
<main class="flex-grow flex flex-col items-center justify-center p-gutter relative overflow-hidden w-full max-w-7xl mx-auto">
<!-- Ambient Background Diffusion -->
<div class="absolute inset-0 pointer-events-none z-0 flex items-center justify-center">
<div class="w-[800px] h-[800px] bg-primary/5 rounded-full blur-[100px] opacity-70"></div>
</div>
<!-- Central Content Wrapper -->
<div class="relative z-10 flex flex-col items-center w-full max-w-2xl text-center">
<!-- Header Group -->
<div class="mb-xl flex flex-col items-center gap-sm">
<span class="font-label-md text-label-md text-primary tracking-widest uppercase">YOUR ANSWERS ARE IN</span>
<h1 class="font-display-lg text-display-lg text-on-surface tracking-tight">Let’s see what actually fits you.</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-xl mt-sm">We’re comparing your money, goals, time, strengths and risk profile against different business models.</p>
</div>
<!-- Visual Node Assembly -->
<div class="relative w-64 h-64 mb-xl flex items-center justify-center animate-float">
<!-- Radial Progress Background -->
<svg class="absolute inset-0 w-full h-full transform -rotate-90" viewbox="0 0 100 100">
<circle class="text-surface-variant/50" cx="50" cy="50" fill="none" r="45" stroke="currentColor" stroke-width="1.5"></circle>
<!-- Animated Progress Segment -->
<circle class="text-primary animate-draw-circle" cx="50" cy="50" fill="none" r="45" stroke="currentColor" stroke-linecap="round" stroke-width="2.5"></circle>
</svg>
<!-- Orbiting Particles -->
<div class="absolute inset-0 animate-[spin_10s_linear_infinite]">
<div class="absolute top-2 left-1/2 w-2 h-2 bg-primary rounded-full transform -translate-x-1/2 shadow-[0_0_8px_rgba(70,72,212,0.6)]"></div>
</div>
<div class="absolute inset-0 animate-[spin_15s_linear_infinite_reverse]">
<div class="absolute bottom-6 right-8 w-1.5 h-1.5 bg-secondary-fixed-dim rounded-full shadow-[0_0_8px_rgba(164,214,76,0.6)]"></div>
</div>
<!-- Central Profile Card (Level 2 Elevation) -->
<div class="relative z-20 w-32 h-32 bg-surface-container-lowest rounded-full animate-pulse-glow flex items-center justify-center border border-surface-variant/30">
<div class="flex flex-col items-center justify-center text-primary">
<span class="material-symbols-outlined text-[40px]" data-icon="troubleshoot" data-weight="fill" style="font-variation-settings: 'FILL' 1;">troubleshoot</span>
</div>
</div>
</div>
<!-- Analysis Stages Checklist -->
<div class="flex flex-col gap-md w-full max-w-sm mx-auto text-left">
<!-- Stage 1: Complete -->
<div class="stage-item flex items-center gap-md p-md bg-surface-container-lowest rounded-lg border border-surface-variant/50 shadow-[0_4px_12px_rgba(0,0,0,0.02)]">
<div class="flex-shrink-0 w-8 h-8 rounded-full bg-primary/10 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-[18px]" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<span class="font-label-md text-label-md text-on-surface">Ingesting Profile Data</span>
</div>
<!-- Stage 2: In Progress -->
<div class="stage-item flex items-center gap-md p-md bg-surface-container-lowest rounded-lg border border-primary/20 shadow-[0_10px_30px_rgba(70,72,212,0.05)] relative overflow-hidden">
<!-- Subtle progress gradient background -->
<div class="absolute inset-0 bg-gradient-to-r from-primary/5 to-transparent animate-pulse"></div>
<div class="relative z-10 flex-shrink-0 w-8 h-8 rounded-full border-2 border-primary/30 border-t-primary animate-spin flex items-center justify-center">
</div>
<span class="relative z-10 font-label-md text-label-md text-primary">Cross-referencing Models</span>
</div>
<!-- Stage 3: Pending -->
<div class="stage-item flex items-center gap-md p-md opacity-40">
<div class="flex-shrink-0 w-8 h-8 rounded-full border border-outline-variant flex items-center justify-center">
<span class="material-symbols-outlined text-outline-variant text-[18px]" data-icon="pending">pending</span>
</div>
<span class="font-body-md text-body-md text-on-surface-variant">Calculating Fit Scores</span>
</div>
</div>
</div>
</main>
<script src="/prototype.js" defer></script>
</body></html>
