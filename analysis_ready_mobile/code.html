<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
        .progress-circle {
            transition: stroke-dashoffset 1.5s ease-in-out;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  <link rel="stylesheet" href="/prototype.css" />

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md relative overflow-hidden">
<!-- Top Nav Placeholder (Suppressed for transactional flow) -->
<!-- Main Content -->
<main class="flex-1 flex flex-col justify-center items-center px-margin-mobile md:px-margin-desktop py-xl relative z-10 w-full max-w-lg mx-auto">
<!-- Progress Visual -->
<div class="relative w-32 h-32 mb-xl flex items-center justify-center">
<svg class="w-full h-full transform -rotate-90" viewbox="0 0 100 100">
<!-- Background track -->
<circle class="opacity-50" cx="50" cy="50" fill="none" r="45" stroke="#F3F4F6" stroke-width="8"></circle>
<!-- Progress track -->
<circle class="progress-circle" cx="50" cy="50" fill="none" r="45" stroke="#4648d4" stroke-dasharray="283" stroke-dashoffset="0" stroke-linecap="round" stroke-width="8"></circle>
</svg>
<div class="absolute inset-0 flex items-center justify-center flex-col">
<span class="font-headline-lg-mobile text-headline-lg-mobile text-primary">100%</span>
</div>
<div class="absolute inset-0 bg-primary/5 rounded-full blur-xl -z-10"></div>
</div>
<!-- Headline -->
<div class="text-center mb-xl w-full">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-background mb-sm">Your profile is ready.</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Analysis complete. We've mapped your ideal paths.</p>
</div>
<!-- Key Stats Stack (Bento/Tactile Style) -->
<div class="w-full space-y-md mb-xl">
<!-- Stat 1 -->
<div class="bg-surface-container-lowest rounded-xl p-lg flex items-center justify-between border border-surface-container-high/50 shadow-[0_10px_30px_rgba(0,0,0,0.04)] relative overflow-hidden group">
<div class="absolute inset-0 bg-gradient-to-b from-white to-surface-bright opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
<div class="flex items-center gap-md relative z-10">
<div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="model_training" data-weight="fill" style="font-variation-settings: 'FILL' 1;">model_training</span>
</div>
<div>
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Readiness Score</p>
<p class="font-headline-md text-headline-md text-on-background">78</p>
</div>
</div>
</div>
<!-- Stat 2 -->
<div class="bg-surface-container-lowest rounded-xl p-lg flex items-center justify-between border border-surface-container-high/50 shadow-[0_10px_30px_rgba(0,0,0,0.04)] relative overflow-hidden group">
<div class="absolute inset-0 bg-gradient-to-b from-white to-surface-bright opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
<div class="flex items-center gap-md relative z-10">
<div class="w-12 h-12 rounded-full bg-secondary-fixed-dim/20 flex items-center justify-center text-secondary">
<span class="material-symbols-outlined" data-icon="explore" data-weight="fill" style="font-variation-settings: 'FILL' 1;">explore</span>
</div>
<div>
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Potential Matches</p>
<p class="font-headline-md text-headline-md text-on-background">7</p>
</div>
</div>
</div>
<!-- Stat 3 -->
<div class="bg-surface-container-lowest rounded-xl p-lg flex items-center justify-between border border-surface-container-high/50 shadow-[0_10px_30px_rgba(0,0,0,0.04)] relative overflow-hidden group">
<div class="absolute inset-0 bg-gradient-to-b from-white to-surface-bright opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
<div class="flex items-center gap-md relative z-10">
<div class="w-12 h-12 rounded-full bg-tertiary-container/10 flex items-center justify-center text-tertiary">
<span class="material-symbols-outlined" data-icon="stars" data-weight="fill" style="font-variation-settings: 'FILL' 1;">stars</span>
</div>
<div>
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Top Match Quality</p>
<p class="font-headline-md text-headline-md text-on-background">92%</p>
</div>
</div>
</div>
</div>
<!-- Highlight Text -->
<div class="bg-surface-container-low rounded-lg p-md mb-xl w-full text-center border border-primary/10">
<p class="font-body-md text-body-md text-on-surface-variant italic">
<span class="font-bold text-primary">Highlight:</span> Your #1 match scored significantly higher than several alternatives.
            </p>
</div>
</main>
<!-- Fixed Bottom CTA -->
<div class="fixed bottom-0 left-0 right-0 p-margin-mobile md:p-margin-desktop bg-gradient-to-t from-background via-background to-transparent z-50 flex justify-center pb-xl">
<button class="w-full max-w-lg h-[56px] bg-primary text-on-primary rounded-lg font-label-md text-label-md flex items-center justify-center gap-sm hover:bg-primary-container transition-all duration-300 shadow-[0_15px_40px_rgba(70,72,212,0.2)] active:scale-[0.98]">
            SEE MY ESCAPEPLAN
            <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
<script>
        // Micro-interaction for the progress circle (simulate drawing)
        document.addEventListener('DOMContentLoaded', () => {
            const circle = document.querySelector('.progress-circle');
            if (circle) {
                // Force a reflow
                void circle.offsetWidth;
                circle.style.strokeDashoffset = '0';
            }
        });
    </script>
<script src="/prototype.js" defer></script>
