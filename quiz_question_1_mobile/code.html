<!-- Main Content Canvas -->
<main class="flex-1 w-full px-margin-mobile pt-lg pb-xl flex flex-col">
<!-- Question Section -->

</div>

</div>
<!-- Choices Stack -->
<div class="flex flex-col gap-md mb-auto" id="choices-container">
<button class="choice-btn group w-full flex items-center justify-between p-lg rounded-xl bg-surface-container-lowest border border-surface-variant shadow-[0_4px_20px_rgba(0,0,0,0.02)] hover:border-primary-fixed-dim hover:bg-surface-bright hover:shadow-[0_8px_30px_rgba(70,72,212,0.05)] transition-all duration-300 text-left relative overflow-hidden" data-value="full-time">
<div class="absolute inset-0 bg-primary-fixed opacity-0 group-[.selected]:opacity-100 transition-opacity duration-300 pointer-events-none"></div>
<span class="text-body-lg font-body-lg text-on-surface group-[.selected]:text-on-primary-fixed group-[.selected]:font-semibold relative z-10">Full-time job</span>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant group-[.selected]:border-primary group-[.selected]:bg-primary flex items-center justify-center transition-all duration-300 relative z-10 shadow-sm">
<span class="material-symbols-outlined text-on-primary text-[14px] opacity-0 scale-50 group-[.selected]:opacity-100 group-[.selected]:scale-100 transition-all duration-300 icon-fill" data-icon="check">check</span>
</div>
<!-- Focus Ring for Accessibility -->
<div class="absolute inset-0 rounded-xl ring-2 ring-primary opacity-0 group-[.selected]:opacity-100 transition-opacity duration-300 pointer-events-none"></div>
</button>
<button class="choice-btn group w-full flex items-center justify-between p-lg rounded-xl bg-surface-container-lowest border border-surface-variant shadow-[0_4px_20px_rgba(0,0,0,0.02)] hover:border-primary-fixed-dim hover:bg-surface-bright hover:shadow-[0_8px_30px_rgba(70,72,212,0.05)] transition-all duration-300 text-left relative overflow-hidden" data-value="studying">
<div class="absolute inset-0 bg-primary-fixed opacity-0 group-[.selected]:opacity-100 transition-opacity duration-300 pointer-events-none"></div>

<div class="w-6 h-6 rounded-full border-2 border-outline-variant group-[.selected]:border-primary group-[.selected]:bg-primary flex items-center justify-center transition-all duration-300 relative z-10 shadow-sm">

</div>
<div class="absolute inset-0 rounded-xl ring-2 ring-primary opacity-0 group-[.selected]:opacity-100 transition-opacity duration-300 pointer-events-none"></div>
</button>
<button class="choice-btn group w-full flex items-center justify-between p-lg rounded-xl bg-surface-container-lowest border border-surface-variant shadow-[0_4px_20px_rgba(0,0,0,0.02)] hover:border-primary-fixed-dim hover:bg-surface-bright hover:shadow-[0_8px_30px_rgba(70,72,212,0.05)] transition-all duration-300 text-left relative overflow-hidden" data-value="business">
<div class="absolute inset-0 bg-primary-fixed opacity-0 group-[.selected]:opacity-100 transition-opacity duration-300 pointer-events-none"></div>
<span class="text-body-lg font-body-lg text-on-surface group-[.selected]:text-on-primary-fixed group-[.selected]:font-semibold relative z-10">Already run a business</span>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant group-[.selected]:border-primary group-[.selected]:bg-primary flex items-center justify-center transition-all duration-300 relative z-10 shadow-sm">
<span class="material-symbols-outlined text-on-primary text-[14px] opacity-0 scale-50 group-[.selected]:opacity-100 group-[.selected]:scale-100 transition-all duration-300 icon-fill" data-icon="check">check</span>
</div>
<div class="absolute inset-0 rounded-xl ring-2 ring-primary opacity-0 group-[.selected]:opacity-100 transition-opacity duration-300 pointer-events-none"></div>
</button>
<button class="choice-btn group w-full flex items-center justify-between p-lg rounded-xl bg-surface-container-lowest border border-surface-variant shadow-[0_4px_20px_rgba(0,0,0,0.02)] hover:border-primary-fixed-dim hover:bg-surface-bright hover:shadow-[0_8px_30px_rgba(70,72,212,0.05)] transition-all duration-300 text-left relative overflow-hidden" data-value="ready">
<div class="absolute inset-0 bg-primary-fixed opacity-0 group-[.selected]:opacity-100 transition-opacity duration-300 pointer-events-none"></div>
<span class="text-body-lg font-body-lg text-on-surface group-[.selected]:text-on-primary-fixed group-[.selected]:font-semibold relative z-10">Ready to start now</span>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant group-[.selected]:border-primary group-[.selected]:bg-primary flex items-center justify-center transition-all duration-300 relative z-10 shadow-sm">
<span class="material-symbols-outlined text-on-primary text-[14px] opacity-0 scale-50 group-[.selected]:opacity-100 group-[.selected]:scale-100 transition-all duration-300 icon-fill" data-icon="check">check</span>

<div class="opacity-0 translate-y-4 pointer-events-none transition-all duration-500 cubic-bezier(0.4, 0, 0.2, 1) flex items-start gap-md bg-secondary-fixed/30 p-md rounded-xl border border-secondary-fixed-dim/50 shadow-sm" id="micro-reaction">
<div class="w-8 h-8 rounded-full bg-secondary-fixed flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-secondary-fixed-variant text-[18px]" data-icon="psychology">psychology</span>
</div>
<p class="text-body-md font-body-md text-on-surface-variant pt-1">Got it. We’ll keep your current situation in mind for the next steps.</p>
</div>
<!-- Floating Action Button (Next) -->
<div class="opacity-0 translate-y-8 pointer-events-none transition-all duration-500 delay-100 cubic-bezier(0.4, 0, 0.2, 1) fixed bottom-margin-mobile left-margin-mobile right-margin-mobile max-w-[calc(448px-40px)] mx-auto z-40" id="action-area">
<button class="w-full h-14 bg-primary text-on-primary rounded-xl text-label-md font-label-md font-bold shadow-[0_15px_40px_rgba(70,72,212,0.25)] hover:bg-surface-tint hover:shadow-[0_15px_40px_rgba(70,72,212,0.35)] hover:-translate-y-1 active:translate-y-0 transition-all duration-300 flex items-center justify-center gap-sm">
                        Continue
                        <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>
</main>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const buttons = document.querySelectorAll('.choice-btn');
            const reaction = document.getElementById('micro-reaction');
            const actionArea = document.getElementById('action-area');
            const mainContent = document.querySelector('main');

            buttons.forEach(btn => {
                btn.addEventListener('click', () => {
                    // Remove selected class from all
                    buttons.forEach(b => {
                        b.classList.remove('selected');
                        // Reset structural borders for unselected to maintain premium feel
                        b.classList.remove('border-transparent');
                        b.classList.add('border-surface-variant');
                    });
                    
                    // Add selected class to clicked
                    btn.classList.add('selected');
                    btn.classList.remove('border-surface-variant');
                    btn.classList.add('border-transparent'); // Border handled by focus ring inner absolute div

                    // Reveal Micro-reaction with animation
                    reaction.classList.remove('opacity-0', 'translate-y-4');
                    reaction.classList.add('opacity-100', 'translate-y-0');
                    
                    // Reveal Action Area with slight delay
                    actionArea.classList.remove('opacity-0', 'translate-y-8', 'pointer-events-none');
                    actionArea.classList.add('opacity-100', 'translate-y-0');
                    
                    // Add padding to main so content isn't hidden behind fixed button
                    mainContent.classList.add('pb-[100px]');
                });
            });
        });
    </script>
<script src="/prototype.js" defer></script>
