<!-- Padding for fixed bottom bar -->
<div class="h-24"></div>
<script>
        function selectCard(selectedEl) {
            // Remove selected class from all
            const cards = document.querySelectorAll('.card-select');
            cards.forEach(card => {
                card.classList.remove('selected', 'border-primary');
                card.classList.add('border-surface-variant');
                const indicator = card.querySelector('.selection-indicator');
                if(indicator) indicator.classList.remove('opacity-100');
                
                const iconBg = card.querySelector('.icon-container');
                if(iconBg && !card.classList.contains('selected')) {
                    iconBg.classList.remove('bg-primary-container/20');
                    iconBg.classList.add('bg-surface-container');
                }
            });

            // Add to selected
            selectedEl.classList.add('selected');
            selectedEl.classList.remove('border-surface-variant');
            
            const indicator = selectedEl.querySelector('.selection-indicator');
            if(indicator) {
                indicator.classList.remove('border-outline-variant');
                indicator.classList.add('border-primary', 'opacity-100');
            }
            
            const iconBg = selectedEl.querySelector('.icon-container');
            if(iconBg) {
                iconBg.classList.remove('bg-surface-container');
                iconBg.classList.add('bg-primary-container/20');
            }

            // Enable Continue Button
            const btn = document.getElementById('continueBtn');
            btn.classList.remove('opacity-50', 'cursor-not-allowed');
            btn.classList.add('hover:opacity-90', 'active:scale-95');
            btn.removeAttribute('disabled');
        }
    </script>
