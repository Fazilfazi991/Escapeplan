<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f5ff"><title>Find your EscapePlan</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assessment/assessment.css"></head>
<body><div class="assessment-shell"><header class="assessment-header"><a class="assessment-brand" href="/" aria-label="EscapePlan home"><span class="assessment-brand-crop"><img src="/escapeplan_logo/screen.png" alt="EscapePlan"></span></a><button class="assessment-exit" type="button" data-action="exit">Exit</button></header>
<main id="assessment" class="assessment-main" tabindex="-1">
<section id="intro-view" class="intro-view" aria-live="polite"><div class="intro-copy"><p id="intro-count" class="intro-count">A clearer way to choose</p><h1 id="intro-title">There are hundreds of businesses you could start.</h1><p id="intro-copy">The useful question is not “Which one looks exciting?” It is “Which few actually fit your life?”</p><button class="intro-button" type="button" data-action="intro-next"><span id="intro-button-label">Show me how</span><span aria-hidden="true">→</span></button><button class="intro-skip" type="button" data-action="intro-skip">Skip introduction</button></div><div class="intro-map" aria-hidden="true"><span class="intro-origin"></span><i></i><i></i><i></i><i></i><i></i><i></i><b>YOUR FIT</b></div></section>
<div id="quiz-view" hidden><section class="route-map" aria-label="Your Escape Route Map"><div class="route-map-head"><strong>Your Escape Route Map</strong><span id="route-status">Listening for your first signal</span></div><div id="route-field" class="route-field" aria-hidden="true"></div></section>
<nav class="stage-progress" aria-label="Assessment stages"><span data-stage="GOAL">Goal</span><i></i><span data-stage="MONEY">Money</span><i></i><span data-stage="STYLE">Style</span><i></i><span data-stage="FIT">Fit</span></nav>
<section id="question-view" class="assessment-view" aria-live="polite"><div class="question-copy"><p id="question-category" class="question-category"></p><h1 id="question-title"></h1><p id="question-help" class="question-help"></p></div><div id="question-visual" class="question-visual" aria-hidden="true"></div><div id="option-list" class="option-list" role="group"></div><div id="reaction" class="assessment-reaction" aria-live="polite" hidden><strong id="reaction-title"></strong><span id="reaction-copy"></span></div></section>
<section id="insight-view" class="insight-view" aria-live="polite" hidden><div id="insight-visual" class="insight-visual" aria-hidden="true"></div><h1 id="insight-title"></h1><p id="insight-copy"></p><button class="insight-continue" type="button" data-action="insight-continue">Continue <span aria-hidden="true">→</span></button></section></div></main>
<footer id="assessment-actions" class="assessment-actions" hidden><div class="assessment-actions-inner"><button class="back-button" type="button" data-action="back"><span aria-hidden="true">←</span> Back</button><button id="continue-button" class="continue-button" type="button" data-action="continue" disabled><span>Continue</span><span aria-hidden="true">→</span></button></div></footer></div>
<script src="/shared/escapeplan-core.js"></script><script src="/assessment/assessment-logic.js"></script><script src="/assessment/assessment-narrator.js"></script><script src="/assessment/assessment.js"></script></body></html>
